[package]
name = "memex"
version = "0.10.1"
edition = "2024"
build = "build.rs"
description = "CLI tool for indexing and searching local agent conversation history"
license = "MIT"
repository = "https://github.com/nicosuave/memex"

[features]
default = []
cuda = ["ort/cuda", "dep:libloading"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dialoguer = "0.11"
chrono = { version = "0.4", features = ["serde"] }
directories = "5.0"
fastembed = "5"
model2vec-rs = "0.1.4"
ort = "2.0.0-rc.10"
crossbeam-channel = "0.5"
once_cell = "1.19"
memchr = "2.7"
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
memmap2 = "0.9"
rayon = "1.10"
regex = "1.10"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
sha2 = "0.10"
simd-json = { version = "0.13", features = ["serde"] }
tantivy = "0.22"
usearch = "2"
toml = "0.8"
walkdir = "2.5"
indicatif = "0.17"
ratatui = { version = "0.30", default-features = false, features = [
    "crossterm_0_29",
    "unstable-rendered-line-info",
] }
crossterm = "0.29"
tui-markdown = { version = "0.3.9", default-features = false }
tempfile = "3"
libc = "0.2"
libloading = { version = "0.8", optional = true }
tiny_http = "0.12"
base64 = "0.22"
getrandom = "0.3"
hmac = "0.12"
subtle = "2.6"

[dev-dependencies]
