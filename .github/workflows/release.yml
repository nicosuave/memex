name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Build
        run: cargo build --release --target aarch64-apple-darwin
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          artifact="memex-${version}-macos-arm64.tar.gz"
          tar -C target/aarch64-apple-darwin/release -czf "${artifact}" memex
          shasum -a 256 "${artifact}" > "${artifact}.sha256"
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: memex-macos-arm64
          path: |
            memex-*.tar.gz
            memex-*.sha256

  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: x86_64
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          arch="${{ matrix.arch }}"
          artifact="memex-${version}-linux-${arch}.tar.gz"
          tar -C target/${{ matrix.target }}/release -czf "${artifact}" memex
          sha256sum "${artifact}" > "${artifact}.sha256"
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: memex-linux-${{ matrix.arch }}
          path: |
            memex-*.tar.gz
            memex-*.sha256

  build-qt-appimage:
    # ONNX Runtime 1.28's Linux binaries require glibc 2.38+, making Ubuntu
    # 24.04 the oldest supported Ubuntu LTS for the bundled memex CLI.
    # Qt itself comes from install-qt-action rather than the system packages.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          # Aqt expects linux_gcc_64 for Qt >= 6.7; gcc_64 resolves to the
          # legacy package name and fails archive selection.
          version: "6.10.*"
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true
      - name: Install system dependencies
        # libssl-dev/pkg-config are for the bundled memex CLI (openssl-sys);
        # file(1) is required by appimagetool.
        run: sudo apt-get update && sudo apt-get install -y build-essential lld curl file libssl-dev pkg-config libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Build AppImage
        run: bash apps/qt/scripts/build-appimage.sh "${RELEASE_TAG#v}"
      - name: Smoke-test AppImage
        run: bash apps/qt/scripts/smoke-appimage.sh apps/qt/build/memex-qt-*-linux-*.AppImage
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: memex-qt-appimage
          path: |
            apps/qt/build/*.AppImage
            apps/qt/build/*.sha256
          if-no-files-found: error

  release:
    needs: [build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: artifacts/*

  release-qt:
    # Separate from `release` so Qt packaging failures never block CLI assets.
    # Runs after the CLI release exists, then appends the AppImage to it.
    needs: [release, build-qt-appimage]
    runs-on: ubuntu-latest
    steps:
      - name: Download AppImage artifact
        uses: actions/download-artifact@v8
        with:
          name: memex-qt-appimage
          path: artifacts
      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: artifacts/*

  update-homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Trigger homebrew-tap update
        run: |
          # Strip all leading v's to handle vv0.2.3 -> 0.2.3
          VERSION="${RELEASE_TAG#v}"
          VERSION="${VERSION#v}"
          curl -X POST \
            -H "Authorization: token ${{ secrets.HOMEBREW_TAP_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/nicosuave/homebrew-tap/dispatches \
            -d "{\"event_type\":\"update-formula\",\"client_payload\":{\"formula\":\"memex\",\"version\":\"${VERSION}\",\"repo\":\"nicosuave/memex\"}}"
