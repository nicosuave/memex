name: Qt app

on:
  push:
    branches: [main]
    paths:
      - "apps/qt/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - ".github/workflows/qt-app.yml"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "apps/qt/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - ".github/workflows/qt-app.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-qt:
    runs-on: ubuntu-latest
    container: fedora:44
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Install checkout prerequisites
        run: dnf install -y git tar gzip

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Fedora Rust and Qt dependencies
        run: |
          bash apps/qt/scripts/install-fedora-deps.sh
          printf '%s\n' /usr/lib64/qt6/bin >> "$GITHUB_PATH"

      - name: Set up Boxington
        uses: jdx/mr-boxington-action@a20e1ffcd962370fb2b6045c13b7b349f7b03386
        with:
          version: 1.11.0
          cache-generation: qt-linux-v1
          # Target mode assumes the root crate; Qt is a standalone nested crate.
          github-cache-mode: objects

      - name: Test native Qt app
        env:
          MEMEX_QT_CAPTURE_DIR: ${{ runner.temp }}/memex-qt-captures
        run: bash apps/qt/scripts/test-container.sh

      - name: Package native Qt development build
        run: bash apps/qt/scripts/build.sh dev

      - name: Upload Qt development archive
        uses: actions/upload-artifact@v7
        with:
          name: memex-qt-linux-x86_64-dev
          path: apps/qt/build/*.tar.gz
          if-no-files-found: error

      - name: Upload Qt test screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: memex-qt-linux-x86_64-dev-screenshots
          path: ${{ runner.temp }}/memex-qt-captures
          if-no-files-found: warn

  appimage-ubuntu-24-04:
    # Match the release environment so the AppImage and its bundled CLI are
    # proven before a tag is pushed.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.*"
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential lld curl file libssl-dev pkg-config libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Build Qt AppImage
        run: bash apps/qt/scripts/build-appimage.sh dev

      - name: Smoke-test Qt AppImage
        run: bash apps/qt/scripts/smoke-appimage.sh apps/qt/build/memex-qt-dev-linux-*.AppImage

      - name: Upload Qt AppImage
        uses: actions/upload-artifact@v7
        with:
          name: memex-qt-linux-x86_64-dev-appimage
          path: |
            apps/qt/build/*.AppImage
            apps/qt/build/*.sha256
          if-no-files-found: error
