name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  macos-app:
    runs-on: macos-26
    env:
      MEMEX_HISTORY_ONLY: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build macOS app
        run: swift build --package-path apps/macos --product Memex --force-resolved-versions

      - name: Test macOS app
        # AppKit tests share process-wide window and application state.
        run: swift test --package-path apps/macos --force-resolved-versions --no-parallel

  release-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check local release scripts
        run: bash apps/macos/Tests/release-scripts.sh
      - name: Check runtime provenance policy without private source
        run: bash apps/macos/Tests/runtime-provenance.sh
      - name: Check Nix daemon activation
        run: bash nix/tests/activation.sh

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Install Chromium
        working-directory: web
        run: bunx playwright install --with-deps chromium

      - name: Typecheck frontend
        working-directory: web
        run: bun run typecheck

      - name: Run browser tests
        working-directory: web
        run: bun run test

      - name: Build production frontend
        working-directory: web
        run: bun run build

      - name: Verify committed frontend assets
        run: git diff --exit-code -- web/dist

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Boxington
        uses: jdx/mr-boxington-action@a20e1ffcd962370fb2b6045c13b7b349f7b03386
        with:
          version: 1.11.0
          cache-generation: build-v1

      - name: Build
        run: mbx build --verbose

      - name: Run unit, integration, and lexical relevance regression tests
        run: mbx test --verbose -- --test-threads=1

      - name: Test profiling feature
        run: cargo test --features profiling --verbose -- --test-threads=1

      - name: Smoke test Criterion benchmarks
        run: cargo bench --bench index --profile dev -- --test

  # homebrew/core autobumps memex from release tags. Build this checkout with the
  # live core formula so a change that breaks its recipe (system ONNX Runtime and
  # SQLite, no network during the build) fails here instead of in the bump PR.
  homebrew-core:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Homebrew
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            export PATH="/home/linuxbrew/.linuxbrew/bin:$PATH"
            echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
          fi
          # Runner images lag Homebrew; core formulae use the current DSL.
          brew update
          brew --version

      - name: Stage the core formula against this checkout
        run: |
          set -euo pipefail
          version=$(sed -n '/^\[package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' Cargo.toml)
          source_archive="$RUNNER_TEMP/memex-$version.tar.gz"
          git archive --format=tar.gz --prefix="memex-$version/" -o "$source_archive" HEAD
          sha=$(shasum -a 256 "$source_archive" | cut -d' ' -f1)

          brew tap-new --no-git local/memex
          formula="$(brew --repo local/memex)/Formula/memex.rb"
          curl -fsSL https://raw.githubusercontent.com/Homebrew/homebrew-core/HEAD/Formula/m/memex.rb -o "$formula"
          # Swap the release tarball for this checkout and drop the bottles so
          # everything else in the recipe runs exactly as core defines it.
          SOURCE_ARCHIVE="$source_archive" VERSION="$version" SHA="$sha" perl -0pi -e '
            s{^  url "[^"]*"$}{  url "file://$ENV{SOURCE_ARCHIVE}"\n  version "$ENV{VERSION}"}m or die "url not found\n";
            s{^  sha256 "[^"]*"$}{  sha256 "$ENV{SHA}"}m or die "sha256 not found\n";
            s{^  bottle do\n.*?^  end\n\n}{}ms or die "bottle block not found\n";
          ' "$formula"
          brew trust --formula local/memex/memex
          cat "$formula"

      - name: Build from source
        run: brew install --build-from-source --verbose local/memex/memex

      - name: Run the formula test
        run: brew test --verbose local/memex/memex

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Set up Boxington
        uses: jdx/mr-boxington-action@a20e1ffcd962370fb2b6045c13b7b349f7b03386
        with:
          version: 1.11.0
          cache-generation: clippy-v1

      - name: Clippy
        run: mbx clippy -- -D warnings

  transcript-markdown-performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Boxington
        uses: jdx/mr-boxington-action@a20e1ffcd962370fb2b6045c13b7b349f7b03386
        with:
          version: 1.11.0
          cache-generation: transcript-markdown-performance-v1

      - name: Compare transcript Markdown performance
        run: >-
          mbx test --release --lib transcript_markdown_perf --
          --ignored --nocapture --test-threads=1

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check
