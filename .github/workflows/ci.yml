name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  macos-app:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build macOS app
        run: swift build --package-path apps/macos --product Memex --force-resolved-versions

      - name: Test macOS app
        timeout-minutes: 10
        # AppKit tests share process-wide window and application state.
        run: swift test --package-path apps/macos --force-resolved-versions --no-parallel

  release-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check local release scripts
        run: bash apps/macos/Tests/release-scripts.sh
      - name: Check Nix daemon activation
        run: bash nix/tests/activation.sh

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Install Chromium
        working-directory: web
        run: bunx playwright install --with-deps chromium

      - name: Typecheck frontend
        working-directory: web
        run: bun run typecheck

      - name: Run browser tests
        working-directory: web
        run: bun run test

      - name: Build production frontend
        working-directory: web
        run: bun run build

      - name: Verify committed frontend assets
        run: git diff --exit-code -- web/dist

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Boxington
        uses: jdx/mr-boxington-action@a20e1ffcd962370fb2b6045c13b7b349f7b03386
        with:
          version: 1.11.0
          cache-generation: build-v1

      - name: Build
        run: mbx build --verbose

      - name: Run unit and integration tests
        timeout-minutes: 10
        run: mbx test --verbose -- --test-threads=1

      - name: Test profiling feature
        timeout-minutes: 10
        run: cargo test --features profiling --verbose -- --test-threads=1

      - name: Smoke test Criterion benchmarks
        timeout-minutes: 10
        run: cargo bench --bench index --profile dev -- --test

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Set up Boxington
        uses: jdx/mr-boxington-action@a20e1ffcd962370fb2b6045c13b7b349f7b03386
        with:
          version: 1.11.0
          cache-generation: clippy-v1

      - name: Clippy
        run: mbx clippy -- -D warnings

  transcript-markdown-performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Boxington
        uses: jdx/mr-boxington-action@a20e1ffcd962370fb2b6045c13b7b349f7b03386
        with:
          version: 1.11.0
          cache-generation: transcript-markdown-performance-v1

      - name: Compare transcript Markdown performance
        run: >-
          mbx test --release --lib transcript_markdown_perf --
          --ignored --nocapture --test-threads=1

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check
